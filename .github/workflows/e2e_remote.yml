name: Remote E2E Smoke Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours

jobs:
  smoke-test-remote:
    name: Run Playwright Tests on Streamlit Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          uv run playwright install --with-deps chromium

      - name: Run E2E Tests
        env:
          STREAMLIT_REMOTE_URL: "https://gameofnhra.streamlit.app/"
          RUN_REMOTE_E2E: "1"
        run: |
          # Removing --screenshot on-failure as it caused CLI errors
          uv run pytest tests/e2e/test_remote_smoke.py --browser chromium --output=test-results

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
