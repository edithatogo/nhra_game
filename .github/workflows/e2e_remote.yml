name: Remote E2E Smoke Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  push:
    paths:
      - 'tests/e2e/**'
      - 'scripts/dashboard.py'

jobs:
  e2e:
    name: Run Playwright Tests on Streamlit Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          uv run playwright install --with-deps chromium

      - name: Run E2E Tests
        env:
          STREAMLIT_REMOTE_URL: "https://gameofnhra.streamlit.app/"
        run: |
          uv run pytest tests/e2e/test_remote_smoke.py --browser chromium --screenshot on-failure --output=test-results

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
