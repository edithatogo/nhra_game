name: Continuous Data Refresh

on:
  schedule:
    - cron: '0 0 1 * *' # Monthly at midnight
  workflow_dispatch: # Manual trigger

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Run Data Ingestion
        run: |
          uv run --no-dev python scripts/data/ingest_aihw_api.py
          uv run --no-dev python scripts/data/ingest_economic_spine.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: automated data refresh (AIHW & WPI) [skip ci]"
          file_pattern: "data/raw/*.csv data/calibration_v21/*.csv"
