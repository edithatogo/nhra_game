name: Continuous Data Refresh

on:
  schedule:
    - cron: '0 0 1 * *' # Monthly at midnight
  workflow_dispatch: # Manual trigger

env:
  POETRY_VERSION: "2.2.1"

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Poetry
        run: pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Install dependencies
        run: poetry install --only main

      - name: Run Data Ingestion
        run: |
          poetry run python scripts/data/ingest_aihw_api.py
          poetry run python scripts/data/ingest_economic_spine.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated data refresh (AIHW & WPI) [skip ci]"
          file_pattern: "data/raw/*.csv data/calibration_v21/*.csv"
