name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Verify the Rust build toolchain
        run: cargo --version
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Paignia pure Nash and application game controls
        run: >-
          uv run --locked pytest -q
          tests/test_subgames_nash.py tests/test_agreement_cycles.py
          tests/test_queuing_game.py tests/test_jax_parity.py
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format src tests --check
      - name: Type check
        run: uv run basedpyright src
      - name: Security scan (Bandit)
        if: matrix.os == 'ubuntu-latest'
        run: uv run bandit -c pyproject.toml -r src
      - name: Dependency hygiene (deptry)
        if: matrix.os == 'ubuntu-latest'
        run: uv run deptry .
      - name: Input traceability (public sources or justification)
        run: uv run python scripts/check_parameters_grounded.py
      - name: Build context pack
        run: uv run python scripts/build_context_pack.py
      - name: Install Chromium for dashboard and PDF tests
        run: uv run --locked playwright install --with-deps chromium
      - name: Provision Graphviz (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! command -v dot >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes graphviz
          fi
          dot -V
      - name: Provision Graphviz (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          if ! command -v dot >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install graphviz
          fi
          dot -V
      - name: Provision Graphviz (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (!(Get-Command dot -ErrorAction SilentlyContinue)) {
            choco install graphviz --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $graphvizBin = Join-Path $env:ProgramFiles 'Graphviz\bin'
            $env:PATH = "$graphvizBin;$env:PATH"
            $graphvizBin >> $env:GITHUB_PATH
          }
          dot -V
      - name: Tests
        run: uv run pytest -q
      - name: Verify Pipeline (Snakemake)
        run: uv run snakemake --cores 1 run_baseline context_pack --forceall
      - name: Build docs
        run: uv run mkdocs build -q

  links:
    name: Link Checker
    runs-on: >-
      ${{ vars.NHRA_LINK_CHECK_REF != '' &&
          vars.NHRA_LINK_CHECK_REF == (github.head_ref || github.ref_name) &&
          github.actor == github.repository_owner &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) &&
          format('nhra-links-{0}-{1}', github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Build context pack
        run: uv run --no-project --python "$(cat .python-version)" python scripts/build_context_pack.py
      - name: List tracked Markdown for link checking
        run: git -c core.quotePath=false ls-files '*.md' | sed 's#^#./#' > "$RUNNER_TEMP/nhra-markdown.txt"
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.7.0
        with:
          token: ''
          args: --no-progress --files-from '${{ runner.temp }}/nhra-markdown.txt'
