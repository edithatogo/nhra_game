name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Verify the Rust build toolchain
        run: cargo --version
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Paignia pure Nash and application game controls
        run: >-
          uv run --locked pytest -q
          tests/test_subgames_nash.py tests/test_agreement_cycles.py
          tests/test_queuing_game.py tests/test_jax_parity.py
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format src tests --check
      - name: Type check
        run: uv run basedpyright src
      - name: Security scan (Bandit)
        if: matrix.os == 'ubuntu-latest'
        run: uv run bandit -c pyproject.toml -r src
      - name: Dependency hygiene (deptry)
        if: matrix.os == 'ubuntu-latest'
        run: uv run deptry .
      - name: Input traceability (public sources or justification)
        run: uv run python scripts/check_parameters_grounded.py
      - name: Build context pack
        run: uv run python scripts/build_context_pack.py
      - name: Tests
        run: uv run pytest -q
      - name: Verify Pipeline (Snakemake)
        run: uv run snakemake --cores 1 run_baseline context_pack --forceall
      - name: Build docs
        run: uv run mkdocs build -q
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.7.0
        if: matrix.os == 'ubuntu-latest'
        with:
          args: --no-progress './**/*.md'
