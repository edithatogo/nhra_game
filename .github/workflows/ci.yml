name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format src tests --check
      - name: Type check
        run: |
          python -m mypy --strict src/nhra_gt
      - name: Input traceability (public sources or justification)
        run: |
          python scripts/check_parameters_grounded.py
      - name: Build context pack
        run: |
          python scripts/build_context_pack.py
      - name: Tests
        run: |
          python -m pytest -q
      - name: Verify Pipeline (Snakemake)
        run: |
          python -m snakemake --cores 1 run_baseline context_pack --forceall
      - name: Build docs
        run: |
          python -m mkdocs build -q
      - name: Link Checker
        uses: lycheeverse/lychee-action@v1.8.0
        with:
          args: --no-progress './**/*.md'