name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format src tests --check
      - name: Type check
        run: uv run basedpyright src
      - name: Security scan (Bandit)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run bandit -c pyproject.toml -r src
      - name: Dependency hygiene (deptry)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run deptry .
      - name: Input traceability (public sources or justification)
        run: uv run python scripts/check_parameters_grounded.py
      - name: Build context pack
        run: uv run python scripts/build_context_pack.py
      - name: Tests
        run: uv run pytest -q
      - name: Verify Pipeline (Snakemake)
        run: uv run snakemake --cores 1 run_baseline context_pack --forceall
      - name: Build docs
        run: uv run mkdocs build -q
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.7.0
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          args: --no-progress './**/*.md'
