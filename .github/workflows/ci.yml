name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Poetry
        run: pip install poetry
      - name: Install
        run: poetry install --with dev
      - name: Lint
        run: |
          poetry run ruff check src tests
          poetry run ruff format src tests --check
      - name: Type check
        run: poetry run mypy --strict src/nhra_gt
      - name: Input traceability (public sources or justification)
        run: poetry run python scripts/check_parameters_grounded.py
      - name: Build context pack
        run: poetry run python scripts/build_context_pack.py
      - name: Tests
        run: poetry run pytest -q
      - name: Verify Pipeline (Snakemake)
        run: poetry run snakemake --cores 1 run_baseline context_pack --forceall
      - name: Build docs
        run: poetry run mkdocs build -q
      - name: Link Checker
        uses: lycheeverse/lychee-action@v1.8.0
        with:
          args: --no-progress './**/*.md'
