site_name: NHRA mechanism models and game-theory maps
site_description: Stylised mechanism models for governance and policy reasoning (not a forecast).
docs_dir: docs_mkdocs

theme:
  name: material
nav:
  - Home: index.md
  - API Reference: api.md
  - Testing & Verification: testing.md
  - Performance Profiling: profiling.md
  - Context: context.md
  - Parameters: parameters.md
  - Usage: usage.md
  - Models: models.md
  - Diagrams: diagrams.md
  - Development: dev.md
  - Project docs:
      - Requirements: requirements.md
      - Design: design.md
      - Tasks: tasks.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
  - git-revision-date-localized:
      type: datetime

markdown_extensions:
  - admonition
  - toc:
      permalink: true
