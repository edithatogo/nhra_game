site_name: NHRA mechanism models and game-theory maps
site_description: Stylised mechanism models for governance and policy reasoning (not a forecast). Licensed under Apache 2.0.
site_url: https://edithatogo.github.io/nhra_gt/
repo_url: https://github.com/edithatogo/nhra_gt
repo_name: edithatogo/nhra_gt
edit_uri: edit/main/docs_mkdocs/

copyright: Copyright &copy; 2025 Dylan A Mordaunt. Licensed under Apache 2.0.

docs_dir: docs_mkdocs

nav:
  - Home: index.md
  - Guides:
    - guides/index.md
    - Researcher Quickstart: guides/researcher_quickstart.md
    - Usage: guides/usage.md
    - Dashboard: dashboard.md
    - Glossary: guides/glossary.md
  - Model Theory:
    - Patient Choice & Queuing: models/queuing.md
    - Strategic Subgames: models/subgames.md
    - System Dynamics: models/dynamics.md
    - Fiscal Rules: models/fiscal.md
  - Project:
    - project/index.md
    - Requirements & Scope: project/requirements.md
    - Design: design.md
    - Diagrams: diagrams.md
    - Context: context.md
  - Development:
    - Development Guide: dev.md
    - Contributing: contributing.md
    - Validation & Testing: validation.md
  - API Reference: reference/index.md
  - FAQ: faq.md
  - Changelog: changelog.md

theme:
  name: material
  custom_dir: docs_mkdocs/overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - social:
      cards_layout_options:
        background_color: "#009688" # Teal
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mike:
      version_selector: true
      canonical_version: latest

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
