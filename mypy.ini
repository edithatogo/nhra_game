[mypy]
mypy_path = src
namespace_packages = True
explicit_package_bases = True
strict = True
ignore_missing_imports = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_reexport = True

# Third party overrides (keep ignore_missing_imports)
[mypy-jax.*]
ignore_missing_imports = True

[mypy-jaxlib.*]
ignore_missing_imports = True

[mypy-flax.*]
ignore_missing_imports = True

[mypy-jaxtyping.*]
ignore_missing_imports = True

[mypy-beartype.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-SALib.*]
ignore_missing_imports = True

[mypy-snakemake.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-pydantic_settings.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-networkx.*]
ignore_missing_imports = True

[mypy-pygambit.*]
ignore_missing_imports = True
