    outputs:
      required: [linkedin_article, linkedin_post, x_thread]
      required_images: [nhra_context_map, game_matrix, principal_agent_map, cover_summary]

  - order: 6
    slug: compliance_game
    title: "Compliance Game: Audit intensity vs gaming incentives"
    nhra_scenario: "Why ‘more audit’ isn’t free, and ‘less audit’ isn’t safe."
    pairing:
      model_type: "inspection / deterrence game"
      solution_concept: "mixed strategies (intuition)"
    code_pointers:
      - path: src/nhra_gt/game_theory/content.py
        id: compliance_game
      - path: src/nhra_gt/subgames/games.py
