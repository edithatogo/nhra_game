# P4 Outreach Series manifest (source of truth)
#
# This file is intentionally the single inventory for the outreach series so that
# scripts can avoid repo-wide scans (important for sync-backed filesystems).
#
# Conventions:
# - `slug` should be filesystem-safe and stable over time.
# - `code_pointers` are workspace-relative paths and identifiers to ground the narrative in code.
# - `outputs.required_images` names are logical; render scripts map them to platform targets.

series:
  id: p4_outreach_series
  title: "NHRA Game Theory Outreach Series"
  audience_primary: "interested_public"
  readability_target: "14yo-friendly"

platform_image_targets:
  linkedin_article_cover:
    - { width: 1200, height: 644 }
    - { width: 2400, height: 1288 }
  linkedin_post_square:
    - { width: 1200, height: 1200 }
    - { width: 2400, height: 2400 }

bundles:
  - order: 1
    slug: definition_game
    title: "Definition Game: What counts as a ‘hospital service’?"
    nhra_scenario: "How definitions and scope-shifting change who pays and what gets counted."
    pairing:
      model_type: "2x2 stage game"
      solution_concept: "Nash equilibrium (intro), best responses"
    code_pointers:
      - path: src/nhra_gt/game_theory/content.py
        id: definition_game
      - path: src/nhra_gt/subgames/games.py
        fn: definition_game
    outputs:
      required:
        - linkedin_article
        - linkedin_post
        - x_thread
      required_images:
        - nhra_context_map
        - game_matrix
        - equilibrium_intuition
        - cover_summary

  - order: 2
    slug: bargaining_game
    title: "Bargaining Game: Agree now or defer for leverage?"
    nhra_scenario: "Why negotiation timing and ‘waiting for a better deal’ can be rational and risky."
    pairing:
      model_type: "2x2 stage game"
      solution_concept: "Nash equilibrium (simple), discounting intuition"
    code_pointers:
      - path: src/nhra_gt/game_theory/content.py
        id: bargaining_game
      - path: src/nhra_gt/subgames/games.py
        fn: bargaining_game
    outputs:
      required: [linkedin_article, linkedin_post, x_thread]
      required_images: [nhra_context_map, game_matrix, leverage_timeline, cover_summary]

  - order: 3
    slug: cost_shifting_game
    title: "Cost Shifting Game: Invest upstream or shift downstream?"
    nhra_scenario: "Why split funding streams can incentivise moving costs instead of fixing problems."
    pairing:
      model_type: "2x2 stage game"
      solution_concept: "Nash equilibrium; externalities"
    code_pointers:
      - path: src/nhra_gt/game_theory/content.py
        id: cost_shifting_game
      - path: src/nhra_gt/subgames/games.py
        fn: cost_shifting_game
    outputs:
      required: [linkedin_article, linkedin_post, x_thread]
      required_images: [nhra_context_map, game_matrix, cost_flow_sankey, cover_summary]

  - order: 4
    slug: discharge_game
    title: "Discharge Game: Coordinate or fragment (bed block)?"
    nhra_scenario: "Why downstream bottlenecks persist even when everyone agrees ‘it’s bad’."
    pairing:
      model_type: "coordination / prisoner's-dilemma style"
      solution_concept: "Nash equilibrium; coordination failure"
    code_pointers:
      - path: src/nhra_gt/game_theory/content.py
        id: discharge_game
      - path: src/nhra_gt/subgames/games.py
        fn: discharge_coordination_game
    outputs:
      required: [linkedin_article, linkedin_post, x_thread]
      required_images: [nhra_context_map, game_matrix, patient_flow_loop, cover_summary]

  - order: 5
    slug: governance_game
    title: "Governance Game: Integrate or separate (principal–agent)?"
    nhra_scenario: "Why governance structure changes incentives, reporting, and accountability."
    pairing:
      model_type: "principal–agent framing"
      solution_concept: "Nash equilibrium; incentives and monitoring"
    code_pointers:
      - path: src/nhra_gt/game_theory/content.py
        id: governance_game
      - path: src/nhra_gt/subgames/games.py
