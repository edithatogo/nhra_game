[project]
name = "nhra_gt"
version = "26.0.1"
description = "Stylised game-theory mechanism models for NHRA negotiations and downstream system pressure"
authors = [
    { name = "Dylan A Mordaunt", email = "15080672+edithatogo@users.noreply.github.com" }
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "networkx>=3.2",
    "plotly>=5.18",
    "scipy>=1.10",
    "SALib>=1.4.7",
    "snakemake>=7.32",
    "streamlit>=1.35",
    "pydantic>=2.0",
    "pandera>=0.18",
    "pydantic-settings>=2.0",
    "seaborn",
    "requests",
    "PyYAML",
    "pyxlsb",
    "beartype",
    "pygambit>=16.4.1",
    "graphviz>=0.21",
    "jax>=0.4",
    "jaxlib>=0.4",
    "jaxopt>=0.8",
    "flax>=0.8",
    "jaxtyping>=0.2",
    "spacy>=3.7",
]

[project.optional-dependencies]
opt = ["optuna>=3.6"]
accel = ["chex>=0.1", "numpyro>=0.13", "polars>=0.20"]
observability = ["logfire>=0.46"]

[tool.poetry]
# Legacy section for build-backend and packages
packages = [
    {include = "nhra_gt", from = "src"},
    {include = "scripts"}
]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-benchmark = "*"
hypothesis = ">=6.100"
hypothesis-auto = "*"
icontract = "*"
locust = "*"
atheris = {version = "*", markers = "sys_platform == 'linux'"}
ruff = ">=0.8"
mypy = ">=1.10"
types-requests = "*"
types-PyYAML = "*"
types-setuptools = "*"
pandas-stubs = "*"
pre-commit = ">=3.7"
nox = ">=2024.0"
isort = ">=5.13"
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
pytest-mock = "*"
pytest-cov = "*"
scalene = ">=1.5"
deptry = "*"
bandit = "^1.9.2"
pyright = "*"
typeguard = "*"
mkdocstrings-python = "^2.0.1"
mkdocs-gen-files = "^0.6.0"
mkdocs-git-revision-date-localized-plugin = "^1.5.0"
mkdocs-literate-nav = "*"
mkdocs-section-index = "*"
mkdocs-jupyter = "*"
mike = "*"
pytest-mpl = "^0.18.0"
kaleido = "^1.2.0"
reportlab = "^4.4.7"
playwright = "^1.57.0"
pytest-playwright = "^0.7.2"
vcrpy = "^7.0.0"

[tool.coverage.run]
omit = ["tests/*", "scripts/*", ".nox/*", ".gemini/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if HAS_JAXTYPING:"
]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if HAS_JAXTYPING:"
]

[tool.coverage.html]
directory = "htmlcov"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "basedpyright>=1.36.2",
    "commitizen>=4.11.0",
    "deptry>=0.24.0",
    "interrogate>=1.7.0",
    "pip-audit>=2.10.0",
    "py>=1.11.0",
    "vulture>=2.14",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts"]
exclude = [
    ".git",
    ".gemini",
    ".nox",
    ".pytest_cache",
    ".ruff_cache",
    ".snakemake",
    ".venv",
    "__pycache__",
    "data",
    "outputs",
    "reports",
    "docs",
    "archive",
    "dist",
    ".mypy_cache",
    ".hypothesis",
    "htmlcov",
    ".benchmarks",
    "temp_blinded_workspace",
]

[tool.ruff.lint]
select = [
    "E", "F", "B", "UP", "SIM", "A", "C4", "N", "PT", "S", "I",
    "RUF",  # Ruff-specific
    "ARG",  # Unused arguments
    "T20",  # Print statements
    "PIE",  # Misc lints
    "PTH",  # Use pathlib
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "UP037", # Remove quotes from type annotation (Jaxtyping compatibility)
    "N806",  # Variable in function should be lowercase (allow math notation like A, B)
    "F722",  # Syntax error in forward annotation (Jaxtyping compatibility)
    "T201",  # print found (allowed in research scripts)
    "PTH",   # Use pathlib (ongoing migration)
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 80
exclude = ["setup.py", "docs", "build", "dist", ".nox", ".venv", ".git", "__pycache__", "tests"]
ignore-regex = ["^get$", "^mock_.*", ".*Base$"]
verbose = 0
quiet = false
color = true
"scripts/**" = ["E402", "T201", "PTH", "ARG"]
"tests/**" = ["S101", "S105", "PT011", "B017", "E402", "S607", "S603", "ARG001", "ARG002", "T201", "RUF059"]
"src/nhra_gt/agent_logic.py" = ["F821", "ARG001"]
"src/nhra_gt/engine.py" = ["F821", "UP037", "E402"]
"src/nhra_gt/solvers_jax.py" = ["F821", "UP037"]
"src/nhra_gt/hierarchical_jax.py" = ["F821", "UP037"]
"src/nhra_gt/calibration/differentiable.py" = ["F821", "UP037"]
"src/nhra_gt/audit/*" = ["S110", "S112"]
"src/nhra_gt/domain/audit.py" = ["S607", "S603"]
"src/nhra_gt/interfaces/protocols.py" = ["F401"]
"src/nhra_gt/sensitivity.py" = ["E402"]
"src/nhra_gt/visualization/interactive.py" = ["C408"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.deptry]
ignore_notebooks = true
extend_exclude = ["tests", "scripts", "archive", "docs_mkdocs", "sitecustomize.py", ".nox", ".gemini"]
known_first_party = ["nhra_gt", "scripts"]

[tool.deptry.per_rule_ignores]
DEP001 = ["nhra_gt", "scripts"]
DEP002 = ["scipy", "snakemake", "jaxlib", "jaxtyping", "polars", "seaborn", "pydantic-settings", "pandera", "networkx", "streamlit", "optuna", "chex", "reportlab", "kaleido"]
DEP003 = ["yaml", "pyxlsb"]
DEP004 = ["nox", "pytest", "hypothesis", "logfire", "mypy", "ruff", "bandit", "deptry", "jaxopt"]

[tool.bandit]
exclude_dirs = ["tests", ".nox", ".gemini", "outputs", "reports", "docs", "archive", "build", "dist"]
skips = ["B101"]

[tool.mutmut]
paths_to_mutate = "src/nhra_gt"
tests_dir = "tests"
runner = "python -m pytest -q"

[tool.basedpyright]
typeCheckingMode = "basic"
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]
# Ensure src is in search path
executionEnvironments = [{ root = "." }]
reportMissingTypeStubs = "warning"
reportMissingImports = "warning"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportGeneralTypeIssues = "none"
