[tool.poetry]
name = "nhra_gt"
version = "26.0.1"
description = "Stylised game-theory mechanism models for NHRA negotiations and downstream system pressure"
authors = ["Dylan A Mordaunt (RACMA working draft)"]
readme = "README.md"
packages = [
    {include = "nhra_gt", from = "src"},
    {include = "scripts"}
]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
numpy = ">=1.24"
pandas = ">=2.0"
matplotlib = ">=3.7"
networkx = ">=3.2"
plotly = ">=5.18"
scipy = ">=1.10"
SALib = ">=1.4.7"
snakemake = ">=7.32"
streamlit = ">=1.35"
pydantic = ">=2.0"
pandera = ">=0.18"
pydantic-settings = ">=2.0"
seaborn = "*"
requests = "*"

# Optional dependencies (extras)
optuna = { version = ">=3.6", optional = true }
jax = { version = ">=0.4", optional = true }
jaxlib = { version = ">=0.4", optional = true }
jaxtyping = { version = ">=0.2", optional = true }
numpyro = { version = ">=0.13", optional = true }
polars = { version = ">=0.20", optional = true }
logfire = { version = ">=0.46", optional = true }

[tool.poetry.extras]
opt = ["optuna"]
accel = ["jax", "jaxlib", "jaxtyping", "numpyro", "polars"]
observability = ["logfire"]
dev = [
    "pytest", "hypothesis", "hypothesis-auto", "icontract-hypothesis",
    "icontract", "locust", "atheris", "ruff", "mypy", "pre-commit",
    "nox", "mkdocs", "mkdocs-material", "mutmut", "pytest-mock",
    "pytest-cov", "scalene", "pyinstrument", "py-spy", "memray",
    "pytest-benchmark", "asv", "deptry", "vulture", "bandit", "pyright",
    "beartype", "typeguard", "mkdocstrings-python", "mkdocs-literate-nav",
    "mkdocs-section-index", "mkdocs-jupyter", "mike",
    "mkdocs-git-revision-date-localized-plugin"
]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
hypothesis = ">=6.100"
hypothesis-auto = "*"
icontract-hypothesis = "*"
icontract = "*"
locust = "*"
atheris = {version = "*", markers = "sys_platform == 'linux'"}
ruff = ">=0.8"
mypy = ">=1.10"
pre-commit = ">=3.7"
nox = ">=2024.0"
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
mutmut = ">=2.4"
pytest-mock = "*"
pytest-cov = "*"
scalene = ">=1.5"
deptry = "*"
vulture = "*"
bandit = "^1.9.2"
pyright = "*"
beartype = "*"
typeguard = "*"
mkdocstrings-python = "^2.0.1"
mkdocs-gen-files = "^0.6.0"
mkdocs-git-revision-date-localized-plugin = "^1.5.0"
mkdocs-literate-nav = "*"
mkdocs-section-index = "*"
mkdocs-jupyter = "*"
mike = "*"

[tool.coverage.run]
omit = ["tests/*", "scripts/*", ".nox/*", ".gemini/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if HAS_JAXTYPING:"
]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if HAS_JAXTYPING:"
]

[tool.coverage.html]
directory = "htmlcov"
playwright = "^1.57.0"
pytest-playwright = "^0.7.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"
strict = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = ["scripts/", "outputs/", "reports/"]
plugins = ["pydantic.mypy", "pandera.mypy"]

[tool.ruff.lint]
select = ["E","F","I","B","UP","SIM","A","C4","N","PT","S"]
ignore = ["E501", "N806"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["S101", "S105", "PT011", "B017", "E402", "S607", "S603"]
"src/nhra_gt/audit/*" = ["S110", "S112"]
"src/nhra_gt/domain/audit.py" = ["S607", "S603"]
"src/nhra_gt/interfaces/protocols.py" = ["F401"]
"src/nhra_gt/sensitivity.py" = ["E402"]
"src/nhra_gt/visualization/interactive.py" = ["C408"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.deptry]
ignore_notebooks = true

[tool.deptry.per_rule_ignores]
DEP001 = ["scripts/*", "tests/*", "src/nhra_gt/*"]
DEP002 = ["scipy", "snakemake", "jaxlib", "jaxtyping", "polars"]
DEP004 = ["nox", "pytest", "hypothesis", "logfire"]

[tool.vulture]
exclude = [".nox", ".gemini", "outputs", "reports", "docs", "archive", "build", "dist"]
min_confidence = 80
paths = ["src", "scripts"]

[tool.bandit]
exclude_dirs = ["tests", ".nox", ".gemini", "outputs", "reports", "docs", "archive", "build", "dist"]
skips = ["B101"]
