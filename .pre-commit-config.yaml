exclude: >-
  (^NHRA Analysis - Improve commissioning brief\.pdf$|^docs/diagrams/|^outputs/|^\.gemini/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md,markdown"]
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-added-large-files
        args: ["--maxkb=5000"]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        files: '^(README\.md|docs/|docs_mkdocs/|conductor/|publications/).*\.(md|markdown)$'
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
      - id: deptry
        name: deptry
        entry: deptry
        language: system
        types: [python]
        files: ^pyproject\.toml$|^src/
        pass_filenames: false
        args: ["."]
