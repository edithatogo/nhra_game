<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Simulation pipeline</title>
  <desc id="desc">A pipeline from parameters to runs, validation, and reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <style>
      .box{fill:rgba(255,255,255,0.06);stroke:rgba(255,255,255,0.18);stroke-width:2}
      .edge{stroke:rgba(255,255,255,0.45);stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .h{font:700 26px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#e2e8f0}
      .t{font:500 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#cbd5e1}
      .k{fill:#99f6e4}
      .p{fill:#c4b5fd}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.55)"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="26" fill="url(#bg)"/>

  <text class="h" x="64" y="78">Simulation pipeline</text>
  <text class="t" x="64" y="110">From parameter registry to reproducible reports.</text>

  <path class="edge" d="M210,270 C320,270 350,270 460,270"/>
  <path class="edge" d="M540,270 C650,270 680,270 790,270"/>
  <path class="edge" d="M870,270 C980,270 1010,270 1120,270"/>

  <rect class="box" x="80" y="220" width="180" height="100" rx="18"/>
  <circle class="k" cx="112" cy="270" r="6"/>
  <text class="t" x="130" y="262">Parameters</text>
  <text class="t" x="130" y="288">registry</text>

  <rect class="box" x="460" y="220" width="180" height="100" rx="18"/>
  <circle class="p" cx="492" cy="270" r="6"/>
  <text class="t" x="510" y="262">Baseline</text>
  <text class="t" x="510" y="288">runs</text>

  <rect class="box" x="790" y="220" width="180" height="100" rx="18"/>
  <circle class="k" cx="822" cy="270" r="6"/>
  <text class="t" x="840" y="262">Validation</text>
  <text class="t" x="840" y="288">&amp; sensitivity</text>

  <rect class="box" x="1120" y="220" width="180" height="100" rx="18" transform="translate(-100,0)"/>
  <circle class="p" cx="1052" cy="270" r="6"/>
  <text class="t" x="1070" y="262" transform="translate(-100,0)">Reports</text>
  <text class="t" x="1070" y="288" transform="translate(-100,0)">and docs</text>
</svg>
