<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">NHRA game theory mechanism models</title>
  <desc id="desc">A banner showing connected nodes representing negotiation stages and downstream system dynamics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <style>
      .t0{font:700 44px/1.1 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#ffffff}
      .t1{font:400 20px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#e6fffb}
      .label{font:600 16px/1 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#e0f2fe}
      .node{fill:#0b1020; stroke:#99f6e4; stroke-width:2}
      .node2{fill:#0b1020; stroke:#c4b5fd; stroke-width:2}
      .edge{stroke:#ffffff; stroke-opacity:.55; stroke-width:2.5; fill:none}
      .chip{fill:url(#panel); stroke:#ffffff; stroke-opacity:.25}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="520" rx="26" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="56" y="56" width="1088" height="408" rx="22" fill="rgba(11,16,32,0.18)" stroke="rgba(255,255,255,0.22)"/>
  </g>

  <g transform="translate(92,110)">
    <text class="t0">NHRA mechanism models + game-theory maps</text>
    <text class="t1" y="58">Negotiation stages → strategy profiles → equilibria → system dynamics → outputs for analysis.</text>
  </g>

  <!-- Network -->
  <g transform="translate(92,160)">
    <path class="edge" d="M110,210 C210,150 330,150 430,210"/>
    <path class="edge" d="M430,210 C540,270 650,270 760,210"/>
    <path class="edge" d="M760,210 C860,150 980,150 1080,210"/>
    <path class="edge" d="M430,210 C540,150 650,150 760,210"/>

    <circle class="node" cx="110" cy="210" r="22"/>
    <circle class="node" cx="430" cy="210" r="22"/>
    <circle class="node2" cx="760" cy="210" r="22"/>
    <circle class="node2" cx="1080" cy="210" r="22"/>

    <rect class="chip" x="70" y="252" rx="14" ry="14" width="150" height="44"/>
    <text class="label" x="90" y="280">Stage games</text>

    <rect class="chip" x="362" y="252" rx="14" ry="14" width="190" height="44"/>
    <text class="label" x="382" y="280">Strategies</text>

    <rect class="chip" x="688" y="252" rx="14" ry="14" width="210" height="44"/>
    <text class="label" x="708" y="280">Equilibria</text>

    <rect class="chip" x="1008" y="252" rx="14" ry="14" width="170" height="44"/>
    <text class="label" x="1028" y="280">Trajectories</text>
  </g>

  <!-- Accent dots -->
  <g opacity="0.7">
    <circle cx="1050" cy="110" r="5" fill="#99f6e4"/>
    <circle cx="1082" cy="134" r="4" fill="#c4b5fd"/>
    <circle cx="1110" cy="112" r="3" fill="#e9d5ff"/>
  </g>
</svg>
