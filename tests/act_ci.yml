name: CI (Local Simulation)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv python install
          uv sync --locked --all-extras --dev
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format src tests --check
      - name: Type check
        run: |
          uv run mypy --strict src/nhra_gt
      - name: Input traceability (public sources or justification)
        run: |
          uv run python scripts/check_parameters_grounded.py
      - name: Build context pack
        run: |
          uv run python scripts/build_context_pack.py
      - name: Tests
        run: |
          uv run pytest -q
      - name: Build docs
        run: |
          uv run mkdocs build -q
