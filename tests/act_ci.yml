name: CI (Local Simulation)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format src tests --check
      - name: Type check
        run: |
          mypy --strict src/nhra_gt
      - name: Input traceability (public sources or justification)
        run: |
          python scripts/check_parameters_grounded.py
      - name: Build context pack
        run: |
          python scripts/build_context_pack.py
      - name: Tests
        run: |
          pytest -q
      - name: Build docs
        run: |
          mkdocs build -q
